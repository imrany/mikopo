<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#fbbf24" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect width="510" height="510" x="1" y="1" rx="109" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Center Shield and Currency/Sparkle Symbol -->
  <g transform="translate(128, 110)">
    <!-- Shield Outline -->
    <path d="M128 0 C180 30 236 30 256 40 C256 160 216 230 128 270 C40 230 0 160 0 40 C20 30 76 30 128 0 Z" 
          fill="#1e293b" stroke="url(#gold)" stroke-width="12" filter="url(#shadow)" />
    
    <!-- M Letter & Sparkle emblem inside -->
    <path d="M68 180 L68 100 L128 150 L188 100 L188 180" 
          fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Star / Sparkle top -->
    <path d="M128 55 L133 70 L148 75 L133 80 L128 95 L123 80 L108 75 L123 70 Z" 
          fill="url(#gold)" />
  </g>
</svg>
